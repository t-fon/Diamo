<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamo // Sandlot & Public Turf Scout</title>

  <!-- Google Fonts: Bebas Neue (Display) & DM Sans 500 (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,500;1,9..40,500&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ember: '#fc5000',
            pumice: '#e2e2df',
            limestone: '#f7f6f2',
            obsidian: '#070607',
            sulfur: '#f5f28e',
            plasma: '#524ae9',
            chalk: '#ffffff'
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'sans-serif'],
            sans: ['"DM Sans"', 'sans-serif']
          },
          borderRadius: {
            'card': '40px',
            'pill': '800px'
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --color-ember: #fc5000;
      --color-pumice: #e2e2df;
      --color-limestone: #f7f6f2;
      --color-obsidian: #070607;
      --color-sulfur: #f5f28e;
      --color-plasma: #524ae9;
      --color-chalk: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--color-pumice);
      color: var(--color-obsidian);
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      margin: 0;
      padding: 0;
    }

    .font-caldera {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.02em;
      line-height: 0.94;
      text-transform: uppercase;
    }

    .caldera-surface {
      background-color: var(--color-limestone);
      border-radius: 40px;
      box-shadow: none !important;
    }

    .caldera-pill {
      border-radius: 800px;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #1a1a1a;
      outline: none;
      z-index: 10;
    }

    .leaflet-popup-content-wrapper {
      background: var(--color-limestone) !important;
      color: var(--color-obsidian) !important;
      border-radius: 24px !important;
      padding: 6px !important;
      box-shadow: 0 10px 30px rgba(7, 6, 7, 0.12) !important;
      border: 1px solid rgba(7, 6, 7, 0.08) !important;
    }
    .leaflet-popup-tip {
      background: var(--color-limestone) !important;
    }
    .leaflet-popup-content {
      font-family: 'DM Sans', sans-serif !important;
      font-weight: 500 !important;
      margin: 10px 14px !important;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--color-pumice);
    }
    ::-webkit-scrollbar-thumb {
      background: #c7c6c2;
      border-radius: 10px;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col overflow-hidden bg-pumice text-obsidian">

  <!-- TOP APP BAR -->
  <header class="w-full bg-pumice px-6 py-4 flex items-center justify-between z-30 shrink-0 border-b border-obsidian/10">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-3 bg-limestone px-5 py-2.5 rounded-pill border border-obsidian/10">
        <div class="w-8 h-8 rounded-pill bg-ember flex items-center justify-center text-obsidian font-display text-xl leading-none pt-0.5">
          D
        </div>
        <div class="flex flex-col">
          <span class="font-display text-2xl tracking-wide text-obsidian leading-none">DIAMO</span>
          <span class="text-[10px] tracking-wider uppercase opacity-60 font-sans -mt-0.5">Sandlot &amp; Public Turf Scout</span>
        </div>
      </div>

      <div class="hidden md:flex items-center gap-2">
        <button class="filter-sport-btn active px-4 py-2 rounded-pill text-xs font-medium uppercase tracking-wider bg-ember text-obsidian transition" data-sport="all">
          All Spots
        </button>
        <button class="filter-sport-btn px-4 py-2 rounded-pill text-xs font-medium uppercase tracking-wider bg-limestone text-obsidian/80 hover:text-obsidian hover:bg-[#eceae4] transition" data-sport="sandlot">
          ⚾ Sandlot
        </button>
        <button class="filter-sport-btn px-4 py-2 rounded-pill text-xs font-medium uppercase tracking-wider bg-limestone text-obsidian/80 hover:text-obsidian hover:bg-[#eceae4] transition" data-sport="turf">
          ⚽ Open Turf
        </button>
        <button class="filter-sport-btn px-4 py-2 rounded-pill text-xs font-medium uppercase tracking-wider bg-limestone text-obsidian/80 hover:text-obsidian hover:bg-[#eceae4] transition" data-sport="lights">
          💡 Night Lights
        </button>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="hidden sm:flex items-center bg-limestone rounded-pill px-4 py-2 border border-obsidian/10 text-xs">
        <span class="w-2 h-2 rounded-pill bg-ember inline-block mr-2 animate-pulse"></span>
        <span>DFW METROPLEX</span>
      </div>

      <button id="btnPinField" class="bg-ember hover:opacity-90 active:scale-95 text-obsidian px-5 py-2.5 rounded-pill text-sm font-medium tracking-wide flex items-center gap-2 transition">
        <i class="ph ph-plus-circle font-bold text-lg"></i>
        <span>SCOUT FIELD</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER: SIDEBAR ON LEFT, MAP ON RIGHT -->
  <main class="flex-1 w-full h-full flex overflow-hidden relative">

    <!-- SIDEBAR DOSSIER LIST (LEFT) -->
    <aside class="w-full md:w-[420px] lg:w-[460px] h-full bg-pumice p-4 md:p-6 flex flex-col gap-4 overflow-y-auto z-20 shrink-0 border-r border-obsidian/10">
      <div class="flex items-center justify-between pt-1">
        <div class="flex items-center gap-2">
          <span class="bg-sulfur text-obsidian text-[11px] font-medium px-3 py-1 rounded-pill uppercase tracking-wider">VERIFIED PARCELS</span>
          <span id="fieldCount" class="text-xs opacity-60">3 LOCATIONS</span>
        </div>
        <span class="text-xs tracking-wider opacity-60 font-sans">SELECT TO FLY</span>
      </div>

      <!-- Field Cards Container -->
      <div id="fieldCardsContainer" class="flex flex-col gap-4">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- MAP CONTAINER (RIGHT) -->
    <div class="flex-1 h-full relative overflow-hidden">
      <div id="map"></div>

      <!-- Floating Map Utility Pills -->
      <div class="absolute bottom-6 left-6 z-20 flex flex-wrap gap-2">
        <button id="btnLocateMe" class="bg-ember text-obsidian hover:opacity-90 px-4 py-2.5 rounded-pill text-xs font-medium flex items-center gap-2 shadow-sm transition">
          <i class="ph ph-crosshair font-bold text-base"></i>
          <span>NEAR ME (GPS)</span>
        </button>
        <button id="btnResetView" class="bg-limestone text-obsidian border border-obsidian/10 hover:bg-[#ebe9e3] px-4 py-2.5 rounded-pill text-xs font-medium flex items-center gap-2 transition">
          <i class="ph ph-compass text-base text-ember"></i>
          <span>RESET VIEW</span>
        </button>
        <button id="btnMeasure" class="bg-limestone text-obsidian border border-obsidian/10 hover:bg-[#ebe9e3] px-4 py-2.5 rounded-pill text-xs font-medium flex items-center gap-2 transition">
          <i class="ph ph-ruler text-base"></i>
          <span id="measureText">MEASURE DISTANCES</span>
        </button>
      </div>
    </div>

  </main>

  <script>
    const FIELDS = [
      {
        id: 'reverchon',
        name: 'REVERCHON PARK MEADOW',
        sport: 'sandlot',
        badge: 'UNFENCED PARCEL',
        badgeType: 'sulfur',
        dist: '2.1 MI',
        lat: 32.7985,
        lng: -96.8122,
        desc: 'Classic unmaintained grass expanse along the Katy Trail with natural backstop angles and deep outfield grass runouts.',
        lighting: 'Ambient trail lighting till 11 PM',
        surface: 'Natural Bermuda turf',
        dimensions: 'Left 310ft • Center 370ft • Right 295ft'
      },
      {
        id: 'flagpole-hill',
        name: 'FLAGPOLE HILL OPEN COMMONS',
        sport: 'sandlot',
        badge: 'OPEN DIAMOND',
        badgeType: 'sulfur',
        dist: '6.4 MI',
        lat: 32.8631,
        lng: -96.7208,
        desc: 'Elevated breezy plateau overlooking White Rock Lake. Packed dirt infield diamond and rolling tree-lined outfield boundaries.',
        lighting: 'Sunset cutoff (no field lamps)',
        surface: 'Compact red dirt & grass',
        dimensions: 'Left 290ft • Center 330ft • Right 310ft'
      },
      {
        id: 'glencoe',
        name: 'GLENCOE PARK BOWL',
        sport: 'turf',
        badge: 'NIGHT ILLUMINATED',
        badgeType: 'ember',
        dist: '4.8 MI',
        lat: 32.8364,
        lng: -96.7725,
        desc: 'Recessed open turf bowl right off Central Expressway. Great for wide pickup scrimmages, rounders, and agility sessions.',
        lighting: 'High-intensity field lights till 10 PM',
        surface: 'Level cut turf meadow',
        dimensions: 'Open rectangular clearance 120yd x 75yd'
      }
    ];

    // Initialize Map on the right
    const map = L.map('map', {
      zoomControl: false
    }).setView([32.825, -96.775], 12);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // Esri High-Resolution Satellite
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: '&copy; Esri &mdash; Diamo Scout'
    }).addTo(map);

    // Leaflet invalidation to ensure tiles load on viewport resize
    setTimeout(() => { map.invalidateSize(); }, 250);

    function createCalderaMarker() {
      return L.divIcon({
        className: 'custom-caldera-marker',
        html: `
          <div style="
            width: 28px;
            height: 28px;
            background-color: var(--color-ember);
            border: 3px solid var(--color-limestone);
            border-radius: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-obsidian);
            font-weight: 700;
            font-size: 11px;
            box-shadow: 0 4px 15px rgba(252, 80, 0, 0.4);
          ">●</div>
        `,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    const markers = {};

    function renderCards(filter = 'all') {
      const container = document.getElementById('fieldCardsContainer');
      container.innerHTML = '';

      const filtered = filter === 'all' 
        ? FIELDS 
        : FIELDS.filter(f => f.sport === filter || (filter === 'lights' && f.badgeType === 'ember'));
      
      document.getElementById('fieldCount').innerText = `${filtered.length} LOCATIONS`;

      filtered.forEach(field => {
        const card = document.createElement('div');
        card.className = 'caldera-surface p-6 flex flex-col gap-3 text-obsidian cursor-pointer hover:bg-white transition duration-150 border border-obsidian/5';
        card.id = `card-${field.id}`;

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="${field.badgeType === 'ember' ? 'bg-ember text-obsidian' : 'bg-sulfur text-obsidian'} text-[11px] font-medium px-3 py-1 rounded-pill uppercase tracking-wider">
              ${field.badge}
            </span>
            <span class="font-caldera text-2xl text-ember tracking-wide">${field.dist}</span>
          </div>

          <div>
            <h2 class="font-caldera text-3xl text-obsidian tracking-wide mb-1">${field.name}</h2>
            <p class="text-xs leading-relaxed opacity-80">${field.desc}</p>
          </div>

          <div class="bg-pumice/70 rounded-2xl p-3 flex flex-col gap-1 text-[11px]">
            <div class="flex items-center gap-2">
              <i class="ph ph-ruler text-ember"></i>
              <span class="font-medium">${field.dimensions}</span>
            </div>
            <div class="flex items-center gap-2">
              <i class="ph ph-lamp text-ember"></i>
              <span class="opacity-80">${field.lighting}</span>
            </div>
          </div>

          <button onclick="flyToField('${field.id}')" class="bg-ember hover:opacity-90 active:scale-98 text-obsidian py-2.5 rounded-pill text-xs font-medium uppercase tracking-wider flex items-center justify-center gap-2 transition mt-1">
            <i class="ph ph-navigation-arrow font-bold text-sm"></i>
            <span>FLY TO DIAMOND</span>
          </button>
        `;

        card.addEventListener('click', (e) => {
          if (!e.target.closest('button')) flyToField(field.id);
        });

        container.appendChild(card);
      });
    }

    function flyToField(id) {
      const field = FIELDS.find(f => f.id === id);
      if (!field) return;

      map.flyTo([field.lat, field.lng], 16, { duration: 1.4 });

      if (markers[id]) markers[id].openPopup();

      document.querySelectorAll('#fieldCardsContainer > div').forEach(el => el.classList.remove('ring-2', 'ring-ember'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('ring-2', 'ring-ember');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // Add field pins to map
    FIELDS.forEach(field => {
      const marker = L.marker([field.lat, field.lng], { icon: createCalderaMarker() }).addTo(map);
      marker.bindPopup(`
        <div style="min-width: 180px;">
          <span style="background: var(--color-sulfur); color: var(--color-obsidian); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 800px; text-transform: uppercase;">
            ${field.badge}
          </span>
          <h3 style="font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin: 6px 0 2px; line-height: 0.95; letter-spacing: 0.02em;">
            ${field.name}
          </h3>
          <p style="font-size: 11px; opacity: 0.8; margin: 0 0 6px 0;">${field.surface}</p>
          <div style="font-size: 10px; font-weight: 600; color: var(--color-ember);">${field.dimensions}</div>
        </div>
      `);

      marker.on('click', () => flyToField(field.id));
      markers[field.id] = marker;
    });

    // Haversine formula for mile distance
    function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return (R * c).toFixed(1);
    }

    // GPS Near Me functionality
    let userMarker = null;
    let userAccuracyCircle = null;

    document.getElementById('btnLocateMe').addEventListener('click', () => {
      const btn = document.getElementById('btnLocateMe');
      btn.innerHTML = '<i class="ph ph-spinner animate-spin text-base"></i><span>ACQUIRING GPS...</span>';

      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        btn.innerHTML = '<i class="ph ph-crosshair font-bold text-base"></i><span>NEAR ME (GPS)</span>';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: '#524ae9',
            color: '#ffffff',
            weight: 3,
            opacity: 1,
            fillOpacity: 1
          }).addTo(map);

          userAccuracyCircle = L.circle([uLat, uLng], {
            radius: pos.coords.accuracy,
            fillColor: '#524ae9',
            fillOpacity: 0.12,
            color: 'transparent'
          }).addTo(map);

          FIELDS.forEach(field => {
            field.dist = `${calculateDistanceMiles(uLat, uLng, field.lat, field.lng)} MI`;
            field._sortDist = parseFloat(field.dist);
          });
          FIELDS.sort((a, b) => a._sortDist - b._sortDist);

          map.flyTo([uLat, uLng], 13, { duration: 1.2 });
          renderCards(document.querySelector('.filter-sport-btn.active')?.dataset.sport || 'all');
          btn.innerHTML = '<i class="ph ph-check-circle font-bold text-base"></i><span>SORTED NEARBY</span>';
        },
        () => {
          alert('Location access denied or unavailable. Please enable browser location permissions.');
          btn.innerHTML = '<i class="ph ph-crosshair font-bold text-base"></i><span>NEAR ME (GPS)</span>';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    });

    // Reset View Button
    document.getElementById('btnResetView').addEventListener('click', () => {
      map.flyTo([32.825, -96.775], 12);
      document.querySelectorAll('#fieldCardsContainer > div').forEach(el => el.classList.remove('ring-2', 'ring-ember'));
    });

    // Category filter pills
    document.querySelectorAll('.filter-sport-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-sport-btn').forEach(b => {
          b.classList.remove('bg-ember', 'text-obsidian', 'active');
          b.classList.add('bg-limestone', 'text-obsidian/80');
        });
        btn.classList.remove('bg-limestone', 'text-obsidian/80');
        btn.classList.add('bg-ember', 'text-obsidian', 'active');

        renderCards(btn.dataset.sport);
      });
    });

    // Turf Measurement Tool
    let measuring = false;
    let measurePoints = [];
    let measureLine = null;

    document.getElementById('btnMeasure').addEventListener('click', () => {
      measuring = !measuring;
      const text = document.getElementById('measureText');
      const btn = document.getElementById('btnMeasure');

      if (measuring) {
        text.innerText = 'CLICK 2 POINTS ON TURF';
        btn.classList.add('bg-ember');
        measurePoints = [];
        if (measureLine) map.removeLayer(measureLine);
      } else {
        text.innerText = 'MEASURE DISTANCES';
        btn.classList.remove('bg-ember');
        if (measureLine) map.removeLayer(measureLine);
      }
    });

    map.on('click', (e) => {
      if (!measuring) return;
      measurePoints.push(e.latlng);

      if (measurePoints.length === 2) {
        const distM = measurePoints[0].distanceTo(measurePoints[1]);
        const distFt = Math.round(distM * 3.28084);

        if (measureLine) map.removeLayer(measureLine);
        measureLine = L.polyline(measurePoints, {
          color: '#fc5000',
          weight: 4,
          dashArray: '6, 6'
        }).addTo(map);

        L.popup()
          .setLatLng(e.latlng)
          .setContent(`<div class="font-caldera text-xl">${distFt} FEET / ${Math.round(distM)} METERS</div>`)
          .openOn(map);

        measuring = false;
        document.getElementById('measureText').innerText = 'MEASURE DISTANCES';
        document.getElementById('btnMeasure').classList.remove('bg-ember');
      }
    });

    // Initial render
    renderCards('all');
  </script>
</body>
</html>
