<!DOCTYPE html>

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: {
              950: '#07080c',
              900: '#0c0e14',
              850: '#11141d',
              800: '#161925',
              700: '#202434',
              600: '#2e344a'

            luma: {
              primary: '#10b981',
              accent: '#6366f1',
              cyan: '#06b6d4',

            'luma-glow': '0 0 25px -4px rgba(16, 185, 129, 0.25)',
            'luma-accent': '0 0 25px -4px rgba(99, 102, 241, 0.3)',

        }
      }

  <!-- Google Fonts & Leaflet Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <!-- Leaflet & Phosphor Icons Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* Custom Scrollbar for Luma Feel */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(12, 14, 20, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Frosted Glass Utilities */
    .glass-panel {
      background: rgba(14, 17, 26, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.65);
    }
    .glass-card {
      background: rgba(20, 24, 36, 0.82);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.5);
    }
    .glass-card:hover {
      background: rgba(28, 34, 52, 0.95);
      box-shadow: 0 16px 32px -6px rgba(0, 0, 0, 0.7);
    }

    /* Leaflet Dark Map Tweaks & Solid Dark Gray Road Treatments */
    .leaflet-container {
      background: #07080c !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* Target Dark Matter tile layer to render solid dark gray roads without dual outlines */
    .dark-matter-layer .leaflet-tile {
      filter: brightness(0.92) contrast(1.18) saturate(0.85);
    }

    /* Street & highway tone normalization */
    .leaflet-tile-pane {
      background: #07080c !important;
    }

    .leaflet-popup-content-wrapper {
      background: rgba(14, 17, 26, 0.96) !important;
      backdrop-filter: blur(20px);
      color: #f3f4f6 !important;
      border-radius: 16px !important;
      padding: 0 !important;
      box-shadow: 0 24px 44px -10px rgba(0,0,0,0.85) !important;
    }
    .leaflet-popup-content {
      margin: 10px 14px !important;
      line-height: 1.4 !important;
    }
    .leaflet-popup-tip {
      background: rgba(14, 17, 26, 0.96) !important;
    }

    /* Pulsing beacon marker animation */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.6); opacity: 0.2; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    .pulse-ring-anim {
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
  </style>
</head>

<body class="bg-obsidian-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-300">

  <!-- TOP ALLTRAILS-STYLE FLOATING SEARCH & FILTER BAR -->
  <header class="absolute top-3 left-3 right-3 z-30 pointer-events-none flex flex-col gap-2">
    <div class="flex items-center gap-2 pointer-events-auto max-w-7xl mx-auto w-full">
      
      <!-- Brand Pill -->
      <div class="glass-panel px-3.5 py-2.5 rounded-2xl flex items-center gap-2.5 shadow-glass shrink-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-obsidian-950 shadow-luma-glow">
          <i class="ph ph-compass-tool font-bold text-lg"></i>
        </div>
        <div class="hidden sm:block">
          <div class="flex items-center gap-1.5 leading-none">
            <span class="font-extrabold tracking-tight text-sm text-white">Diamo</span>
            <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-md bg-emerald-500/15 text-emerald-400">Scout</span>
          </div>
          <p class="text-[10px] text-zinc-400 font-medium mt-0.5">Open Turf &amp; Sandlot Engine</p>
        </div>
      </div>

      <!-- Search Input Container -->
      <div class="glass-panel rounded-2xl flex-1 flex items-center px-3.5 py-2 shadow-glass transition-all focus-within:bg-obsidian-850">
        <i class="ph ph-magnifying-glass text-zinc-400 text-lg mr-2.5 shrink-0"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search meadows, retention flats, unzoned pastures, open parks..." 
          class="w-full bg-transparent text-xs sm:text-sm text-zinc-100 placeholder:text-zinc-500 focus:outline-none"
        />
        <button id="btnClearSearch" class="hidden text-zinc-400 hover:text-zinc-200 text-sm ml-2">
          <i class="ph ph-x-circle"></i>
        </button>
      </div>

      <!-- Scout Pin & Drawer Toggles -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="btnToggleScoutMode" class="glass-panel hover:bg-obsidian-800 text-zinc-200 hover:text-white px-3.5 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-1.5 transition shadow-glass">
          <i class="ph ph-ruler text-emerald-400 text-base"></i>
          <span class="hidden md:inline">Measure / Pin Parcel</span>
        </button>
        <button id="btnToggleList" class="md:hidden glass-panel text-zinc-200 p-2.5 rounded-2xl shadow-glass">
          <i class="ph ph-list-dashes text-lg" id="listToggleIcon"></i>
        </button>
      </div>
    </div>

    <!-- HORIZONTAL QUICK SPORT SELECTOR DOCK -->
    <div class="pointer-events-auto flex items-center gap-2 overflow-x-auto pb-1 max-w-7xl mx-auto w-full px-0.5 no-scrollbar" id="sportSelectorBar">
      <!-- Injected via JavaScript -->
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden relative pt-24 sm:pt-28">
    
    <!-- ALLTRAILS-STYLE SIDEBAR / CARD FEED -->
    <aside id="cardsSidebar" class="w-full md:w-[440px] lg:w-[470px] bg-obsidian-950/95 backdrop-blur-2xl flex flex-col z-20 shrink-0 transition-transform duration-300">
      
      <!-- Filter Summary & Stats Bar -->
      <div class="px-4 py-3 flex items-center justify-between text-xs bg-obsidian-900/80 shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-luma-glow"></span>
          <span class="font-semibold text-zinc-300 uppercase tracking-wider text-[11px]" id="resultsCountLabel">Discovering Patches...</span>
        </div>

        <div class="flex items-center gap-2">
          <!-- Slope Quick Toggle -->
          <button id="btnFilterFlatOnly" class="text-[11px] px-2.5 py-1 rounded-lg bg-obsidian-850 text-zinc-400 hover:text-zinc-200 transition flex items-center gap-1">
            <i class="ph ph-chart-line-down"></i>
            <span>Flat &lt;2% Grade</span>
          </button>
          
          <!-- Distance / Sort dropdown -->
          <select id="sortSelect" class="bg-obsidian-850 text-zinc-300 text-[11px] rounded-lg px-2 py-1 focus:outline-none">
            <option value="match">Best Match</option>
            <option value="rating">Top Rated</option>
            <option value="size">Largest Area</option>
          </select>
        </div>
      </div>

        <!-- Injected via JS -->
      </div>

      <!-- Scrollable Field Cards Feed -->

        <!-- Injected dynamically via JS -->
      </div>
    </aside>

    <!-- INTERACTIVE MAP CONTAINER -->

        <div class="glass-panel p-1.5 rounded-2xl flex flex-col gap-1 shadow-glass">

          </button>

            <span class="hidden sm:inline">Satellite</span>

        </div>

        </button>
      </div>

            <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-ring-anim"></span>
            <span class="text-xs font-bold text-white uppercase tracking-wider">Parcel Field Ruler</span>
          </div>
          <button id="btnCloseRuler" class="text-zinc-400 hover:text-white text-sm">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <p class="text-[11px] text-zinc-400 mb-2">Click any two points on open grass to measure yardage &amp; test clearance.</p>

            <span class="text-[10px] text-zinc-400 uppercase block font-sans">Length</span>
            <span id="rulerLength" class="text-emerald-400 font-bold text-sm">-- Yds</span>

            <span class="text-[10px] text-zinc-400 uppercase block font-sans">Clearance</span>
            <span id="rulerStatus" class="text-zinc-300 font-bold text-xs">Awaiting points</span>
          </div>
        </div>
        <button id="btnPinCustomPatch" class="mt-2.5 w-full py-2 bg-emerald-500 hover:bg-emerald-400 text-obsidian-950 font-bold rounded-xl text-xs transition flex items-center justify-center gap-1.5 shadow-luma-glow">
          <i class="ph ph-plus-circle-bold"></i> Save as Scouted Patch
        </button>

    </section>

        <!-- Injected dynamically on card selection -->

    </div>

    <!-- Backdrop for mobile drawer -->

    function createMapPinIcon(field, fitResult) {
      const isFit = fitResult.status === 'fit';
      const isMod = fitResult.status === 'moderate';
      const pinColor = isFit ? '#10b981' : isMod ? '#f59e0b' : '#f43f5e';
      const glowClass = isFit ? 'shadow-luma-glow' : '';
      const hasBeacon = field.beacon && field.beacon.active;

      const html = `
        <div class="relative group cursor-pointer">
          ${hasBeacon ? `
            <div class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-400 rounded-full z-20">
              <span class="absolute inset-0 rounded-full bg-emerald-400 pulse-ring-anim"></span>
            </div>
          ` : ''}
          <div class="w-8 h-8 rounded-xl bg-obsidian-900 text-white flex items-center justify-center transition-transform transform group-hover:scale-115 ${glowClass}" style="box-shadow: 0 4px 18px ${pinColor}45;">
            <i class="ph ${SPORTS_SPECS[activeSport].icon} text-base" style="color: ${pinColor};"></i>
          </div>
        </div>
      `;

      return L.divIcon({
        className: 'custom-luma-marker',
        html: html,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    function renderMarkers() {

      filtered.forEach(function(field) {
        const fitResult = SPORTS_SPECS[activeSport].checkFit(field);
        const marker = L.marker([field.lat, field.lng], {
          icon: createMapPinIcon(field, fitResult)
        }).addTo(map);

        marker.on('click', function() {
          openFieldDossier(field.id);
        });

        marker.bindTooltip(`

            <div class="font-extrabold text-white flex items-center gap-1">
              ${field.name}
              <span class="text-amber-400 font-bold">★ ${field.rating}</span>
            </div>
            <div class="text-[10px] text-zinc-400 font-mono">${field.lengthYds}x${field.widthYds} yds • ${fitResult.badge}</div>
          </div>
        `, { direction: 'top', offset: [0, -10] });

        markersLayer[field.id] = marker;
      });
    }

    function fitMapToMarkers() {
      const markers = Object.values(markersLayer);
      if (markers.length === 0) return;
      const group = L.featureGroup(markers);
      map.fitBounds(group.getBounds().pad(0.18));
    }

    function getFilteredFields() {
      return fieldDatabase.filter(function(field) {
        const q = searchQuery.toLowerCase();
        const matchesQuery = field.name.toLowerCase().includes(q) ||
                             field.location.toLowerCase().includes(q) ||
                             field.category.toLowerCase().includes(q) ||
                             field.turfType.toLowerCase().includes(q);

        const matchesSlope = !filterFlatOnly || (field.slopeGrade <= 2.0);

        return matchesQuery && matchesSlope;
      }).sort(function(a, b) {
        if (sortBy === 'rating') return b.rating - a.rating;
        if (sortBy === 'size') return (b.lengthYds * b.widthYds) - (a.lengthYds * a.widthYds);
        
        const aFit = SPORTS_SPECS[activeSport].checkFit(a).status === 'fit' ? 2 : 1;
        const bFit = SPORTS_SPECS[activeSport].checkFit(b).status === 'fit' ? 2 : 1;
        return bFit - aFit;
      });
    }

                  <span class="text-zinc-300">Open pickup • Bring cleats</span>
                </div>

                <button id="btnJoinGame" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-obsidian-950 font-extrabold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-luma-glow transition">
                  <i class="ph ph-hand-palm-bold text-base"></i>
                  <span>Count Me In (I am In)</span>
                </button>
              </div>
            ` : `
              <div class="glass-panel p-4 rounded-2xl text-center space-y-2">
                <p class="text-xs text-zinc-400">No pickup run currently called at this patch.</p>
                <button id="btnCreateBeacon" class="px-4 py-2 bg-obsidian-800 hover:bg-obsidian-700 text-zinc-200 hover:text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 mx-auto transition">
                  <i class="ph ph-megaphone text-emerald-400"></i>
                  <span>Broadcast a Pickup Call</span>
                </button>
              </div>
            `}
          </div>

          <div class="pt-4 space-y-2.5">
            <h4 class="text-xs font-extrabold uppercase tracking-wider text-zinc-400 flex items-center justify-between">
              <span>Scout Ground Reports</span>
              <button class="text-[11px] text-emerald-400 hover:underline">Write Log</button>
            </h4>

            ${field.reviews.map(function(r) {
              return `
                <div class="glass-panel p-3 rounded-xl text-xs">
                  <div class="flex items-center justify-between text-[11px] text-zinc-400 mb-1">
                    <span class="font-bold text-zinc-200">${r.author}</span>
                    <span class="font-mono text-[10px]">${r.time}</span>
                  </div>
                  <p class="text-zinc-300 text-[11px] leading-relaxed">${r.text}</p>
                </div>
              `;
            }).join('')}
          </div>

          <div class="pt-2 flex gap-2">
            <button id="btnCopyDossier" class="flex-1 py-2.5 glass-panel rounded-xl text-xs font-semibold text-zinc-300 hover:text-white flex items-center justify-center gap-1.5 transition">
              <i class="ph ph-share-network"></i>
              <span>Share Field</span>
            </button>
            <button id="btnOpenNavigation" class="flex-1 py-2.5 bg-zinc-100 hover:bg-white text-obsidian-950 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition">
              <i class="ph ph-navigation-arrow-fill"></i>
              <span>Google Maps</span>
            </button>
          </div>

        </div>
      `;

      document.getElementById('btnCloseDossier').addEventListener('click', closeDossier);

      const btnJoin = document.getElementById('btnJoinGame');
      if (btnJoin) {
        btnJoin.addEventListener('click', function() {
          if (field.beacon) {
            field.beacon.roster += 1;
            field.beacon.needed = Math.max(0, field.beacon.needed - 1);
            renderDossier(id);
            renderCards();
          }
        });
      }

      const btnCreate = document.getElementById('btnCreateBeacon');
      if (btnCreate) {
        btnCreate.addEventListener('click', function() {
          field.beacon = {
            active: true,
            sport: activeSport,
            title: `Casual ${SPORTS_SPECS[activeSport].name} Run`,
            time: 'Today in 45 min',
            host: 'You (Scout)',
            roster: 3,
            needed: 5
          };
          renderMarkers();
          renderDossier(id);
          renderCards();
        });
      }

      document.getElementById('btnCopyDossier').addEventListener('click', function() {
        const text = `${field.name} (${field.lat}, ${field.lng}) - Scouted on Diamo`;
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        
        const btn = document.getElementById('btnCopyDossier');
        btn.innerHTML = `<i class="ph ph-check text-emerald-400"></i> Copied to Clipboard!`;
        setTimeout(function() {
          btn.innerHTML = `<i class="ph ph-share-network"></i> <span>Share Field</span>`;
        }, 1800);
      });

      document.getElementById('btnOpenNavigation').addEventListener('click', function() {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${field.lat},${field.lng}`, '_blank');
      });
    }

    function renderFieldDiagram(sport) {
      if (sport === 'baseball') {
        return `
          <div class="relative w-24 h-24 rotate-45 flex items-center justify-center bg-emerald-500/10 rounded-lg">
            <div class="w-10 h-10 bg-amber-400/20 rounded"></div>
            <div class="w-1.5 h-1.5 bg-white rounded-full absolute"></div>
            <div class="absolute -top-5 text-[8px] font-mono text-emerald-400/80">310ft Outfield</div>
          </div>
        `;
      } else if (sport === 'ultimate') {
        return `
          <div class="w-52 h-16 rounded flex bg-cyan-950/40">
            <div class="w-10 h-full bg-cyan-500/15 flex items-center justify-center text-[7px] font-mono text-cyan-300">END</div>
            <div class="flex-1 flex items-center justify-center text-[9px] font-mono font-bold text-white tracking-widest">70YD PITCH</div>
            <div class="w-10 h-full bg-cyan-500/15 flex items-center justify-center text-[7px] font-mono text-cyan-300">END</div>
          </div>
        `;
      } else if (sport === 'soccer') {
        return `
          <div class="w-48 h-20 rounded flex items-center justify-center bg-indigo-950/40 relative">
            <div class="w-10 h-10 rounded-full bg-indigo-400/15"></div>
            <div class="w-1 h-full bg-indigo-400/20 absolute"></div>
            <div class="w-3 h-8 bg-indigo-400/20 absolute left-0 rounded-r"></div>
            <div class="w-3 h-8 bg-indigo-400/20 absolute right-0 rounded-l"></div>
          </div>
        `;
      } else if (sport === 'football') {
        return `
          <div class="w-48 h-16 rounded flex bg-amber-950/40">
            <div class="w-8 h-full bg-amber-400/15 flex items-center justify-center text-[7px] font-mono text-amber-300">EZ</div>
            <div class="flex-1 flex justify-around items-center text-[7px] font-mono text-zinc-400">
              <span>20</span><span>40</span><span>20</span>
            </div>
            <div class="w-8 h-full bg-amber-400/15 flex items-center justify-center text-[7px] font-mono text-amber-300">EZ</div>
          </div>
        `;
      } else {
        return `
          <div class="w-24 h-24 rotate-45 flex items-center justify-center bg-rose-500/15 rounded-lg">
            <div class="w-12 h-12 bg-rose-500/25 rounded"></div>
            <div class="w-2 h-2 rounded-full bg-rose-400 absolute"></div>
          </div>
        `;
      }
    }

    function handleMapClick(e) {
      if (!isMeasuring) return;

      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      rulerPoints.push([lat, lng]);

      if (rulerPoints.length === 1) {
        rulerStatus.textContent = "Click second point...";
        rulerLength.textContent = "Measuring...";
      } else if (rulerPoints.length >= 2) {
        const p1 = L.latLng(rulerPoints[0][0], rulerPoints[0][1]);
        const p2 = L.latLng(rulerPoints[1][0], rulerPoints[1][1]);
        const meters = map.distance(p1, p2);
        const yards = Math.round(meters * 1.09361);

        rulerLength.textContent = `${yards} Yds`;

        if (rulerLine) map.removeLayer(rulerLine);
        // Solid measure polygon / swath without line stroke outlines
        rulerLine = L.polyline(rulerPoints, { color: '#10b981', weight: 4, opacity: 0.85 }).addTo(map);

        if (yards >= SPORTS_SPECS[activeSport].minLen) {
          rulerStatus.textContent = "Sufficient for " + SPORTS_SPECS[activeSport].name;
          rulerStatus.className = "text-emerald-400 font-bold text-xs";
        } else {
          rulerStatus.textContent = "Too short (Needs " + SPORTS_SPECS[activeSport].minLen + "yd)";
          rulerStatus.className = "text-rose-400 font-bold text-xs";
        }

        rulerPoints = [];
      }
    }

    btnToggleScoutMode.addEventListener('click', function() {
      isMeasuring = !isMeasuring;
      if (isMeasuring) {
        measureHud.classList.remove('hidden');
        btnToggleScoutMode.className = 'glass-panel bg-emerald-500/25 text-emerald-300 px-3.5 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-1.5 transition shadow-luma-glow';
      } else {
        closeRuler();
      }
    });

    function closeRuler() {
      isMeasuring = false;
      measureHud.classList.add('hidden');
      btnToggleScoutMode.className = 'glass-panel hover:bg-obsidian-800 text-zinc-200 hover:text-white px-3.5 py-2.5 rounded-2xl text-xs font-semibold flex items-center gap-1.5 transition shadow-glass';
      if (rulerLine) {
        map.removeLayer(rulerLine);
        rulerLine = null;
      }
      rulerPoints = [];
    }

    btnCloseRuler.addEventListener('click', closeRuler);

    btnPinCustomPatch.addEventListener('click', function() {
      const center = map.getCenter();
      const customId = `custom-${Date.now()}`;
      const newField = {
        id: customId,
        name: `Scouted Green Space #${fieldDatabase.length + 1}`,
        location: 'Plano, TX • Unmapped Parcel',
        category: 'Wild Open Pasture',
        lat: center.lat,
        lng: center.lng,
        rating: 5.0,
        reviewsCount: 1,
        lengthYds: 100,
        widthYds: 65,
        turfType: 'Native Turf',
        turfCondition: 'Firm open ground',
        slopeGrade: 0.5,
        trees: 'Clear',
        backstop: 'None',
        sunExposure: 'Open daylight',
        parking: 'Street curb',
        permitRequired: false,
        lastMowed: 'Scouted today',
        imageUrl: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800&q=80',
        summary: 'Newly scouted open public grass parcel.',
        beacon: null,
        reviews: [
          { author: 'You (Scout)', time: 'Just now', text: 'Clean parcel measured and logged.' }
        ]
      };

      fieldDatabase.unshift(newField);
      closeRuler();
      renderMarkers();
      renderCards();
      openFieldDossier(customId);
    });

    searchInput.addEventListener('input', function(e) {
      searchQuery = e.target.value.trim();
      btnClearSearch.classList.toggle('hidden', searchQuery.length === 0);
      renderCards();
      renderMarkers();
    });

    btnClearSearch.addEventListener('click', function() {
      searchInput.value = '';
      searchQuery = '';
      btnClearSearch.classList.add('hidden');
      renderCards();
      renderMarkers();
    });

    btnFilterFlatOnly.addEventListener('click', function() {
      filterFlatOnly = !filterFlatOnly;
      if (filterFlatOnly) {
        btnFilterFlatOnly.className = 'text-[11px] px-2.5 py-1 rounded-lg bg-emerald-500/25 text-emerald-300 transition flex items-center gap-1 font-semibold';
      } else {
        btnFilterFlatOnly.className = 'text-[11px] px-2.5 py-1 rounded-lg bg-obsidian-850 text-zinc-400 hover:text-zinc-200 transition flex items-center gap-1';
      }
      renderCards();
      renderMarkers();
    });

    sortSelect.addEventListener('change', function(e) {
      sortBy = e.target.value;
      renderCards();
    });

    modalBackdrop.addEventListener('click', closeDossier);

    let isMobileListOpen = true;
    btnToggleList.addEventListener('click', function() {
      isMobileListOpen = !isMobileListOpen;
      if (isMobileListOpen) {
        cardsSidebar.classList.remove('-translate-x-full', 'hidden');
        document.getElementById('listToggleIcon').className = 'ph ph-map-trifold text-lg';
      } else {
        cardsSidebar.classList.add('-translate-x-full', 'hidden');
        document.getElementById('listToggleIcon').className = 'ph ph-list-dashes text-lg';
      }
    });

    window.onload = function() {
      initLeafletMap();
      renderSportPills();
      renderSportBanner();
      renderCards();
    };
  </script>
</body>
</html>
